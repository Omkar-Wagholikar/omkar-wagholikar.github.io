<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="njbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a33"/>
      <stop offset="100%" stop-color="#120c1c"/>
    </linearGradient>
    <linearGradient id="njmoon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a6ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#njbg)"/>

  <!-- stars -->
  <g fill="#c9a6ff" opacity="0.8">
    <circle cx="112" cy="120" r="4"/>
    <circle cx="150" cy="90" r="3"/>
    <circle cx="90" cy="170" r="2.5"/>
    <circle cx="392" cy="360" r="3"/>
    <circle cx="360" cy="410" r="2.5"/>
  </g>

  <!-- crescent moon -->
  <path d="M 300 96
           A 120 120 0 1 0 300 336
           A 96 96 0 1 1 300 96 Z"
        fill="url(#njmoon)"/>

  <!-- journal page -->
  <rect x="140" y="300" width="220" height="150" rx="18" fill="#1c1428" stroke="#8b5cf6" stroke-width="6"/>
  <line x1="172" y1="342" x2="328" y2="342" stroke="#c9a6ff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <line x1="172" y1="374" x2="308" y2="374" stroke="#c9a6ff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <line x1="172" y1="406" x2="272" y2="406" stroke="#c9a6ff" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
</svg>
